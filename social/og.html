<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
  html, body { margin: 0; padding: 0; }
  body { font-family: "Noto Sans TC", "WenQuanYi Zen Hei", sans-serif; -webkit-font-smoothing: antialiased; }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; color: #faf9f5;
    background: linear-gradient(180deg, #16305f 0%, #28508f 55%, #5d87c4 100%); --ridge: 230px; }
  .card.square { width: 1080px; height: 1080px; --ridge: 400px; }
  .stars { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ridge { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: var(--ridge); display: block; }
  .txt { position: absolute; left: 72px; top: 50px; right: 72px; }
  .square .txt { left: 80px; top: 110px; right: 80px; }
  .eyebrow { font-size: 24px; font-weight: 500; letter-spacing: .06em; opacity: .9; margin: 0 0 10px; }
  .square .eyebrow { font-size: 30px; margin-bottom: 18px; }
  h1 { font-size: 86px; font-weight: 700; line-height: 1.1; margin: 0; letter-spacing: .02em; }
  .square h1 { font-size: 108px; }
  .sub { font-size: 27px; font-weight: 400; line-height: 1.5; margin: 14px 0 0; opacity: .95; }
  .square .sub { font-size: 36px; margin-top: 28px; }
  .tags { position: absolute; left: 72px; bottom: calc(var(--ridge) + 24px); display: flex; gap: 14px; }
  .moon { position: absolute; right: 84px; top: 64px; width: 76px; height: 76px; }
  .square .moon { right: 96px; top: 72px; width: 92px; height: 92px; }
  .square .tags { left: 80px; bottom: calc(var(--ridge) + 60px); }
  .tag { font-size: 23px; font-weight: 500; padding: 7px 20px; border-radius: 999px; background: rgba(250,249,245,.16); border: 1.5px solid rgba(250,249,245,.6); color: #faf9f5; }
  .square .tag { font-size: 28px; padding: 9px 24px; }
  .src { position: absolute; right: 72px; bottom: 34px; font-size: 21px; color: #2b4a7e; font-weight: 500; opacity: .9; }
  .square .src { right: 80px; bottom: 56px; font-size: 25px; }
</style>
</head>
<body>
<div class="card" id="card">
  <svg class="stars" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMin slice">
    <g fill="#faf9f5" opacity=".75">
      <circle cx="880" cy="70" r="2"/><circle cx="960" cy="150" r="1.5"/><circle cx="1040" cy="52" r="2.2"/>
      <circle cx="1120" cy="130" r="1.4"/><circle cx="1000" cy="220" r="1.6"/><circle cx="1150" cy="40" r="1.2"/>
      <circle cx="920" cy="250" r="1.3"/><circle cx="1085" cy="200" r="2"/><circle cx="840" cy="175" r="1.2"/><circle cx="1170" cy="260" r="1.5"/>
    </g>
  </svg>
  <svg class="moon" viewBox="0 0 80 80"><circle cx="40" cy="40" r="36" fill="#f3e4b4"/><circle cx="24" cy="28" r="32" fill="#1d3b70"/></svg>
  <svg class="ridge" viewBox="0 0 1200 270" preserveAspectRatio="none">
    <path d="M0 120 L110 60 L230 95 L360 20 L480 80 L600 0 L720 70 L850 15 L960 75 L1080 30 L1200 85 L1200 270 L0 270 Z" fill="#4f78b8" opacity=".9"/>
    <path d="M0 190 L130 135 L260 165 L400 95 L540 160 L680 70 L820 150 L930 100 L1060 170 L1200 125 L1200 270 L0 270 Z" fill="#dfe7f3"/>
    <path d="M0 240 L150 200 L300 225 L450 170 L620 230 L790 185 L980 235 L1200 200 L1200 270 L0 270 Z" fill="#faf9f5"/>
    <ellipse cx="330" cy="238" rx="120" ry="16" fill="#3f8fd2"/>
    <ellipse cx="318" cy="235" rx="70" ry="7" fill="#8fcbf2" opacity=".6"/>
  </svg>
  <div class="txt">
    <p class="eyebrow">11/6–11/8｜戒茂斯上嘉明湖・向陽出｜三天兩夜</p>
    <h1>嘉明湖沿線氣溫</h1>
    <p class="sub">沿線各點的逐時氣溫、體感、降雨機率與觀星條件，<br>每天自動更新，上山沒訊號也能看。</p>
  </div>
  <div class="tags"><span class="tag">中央氣象署</span><span class="tag">ECMWF／GFS</span><span class="tag">雨量站實測</span></div>
  <div class="src">預報僅供參考，實際以現場與官方公告為準</div>
</div>
</body>
</html>
